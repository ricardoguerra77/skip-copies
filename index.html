<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skip Copies</title>
    <meta name="description" content="Skip Copies — revisão de copies com três agentes (hook, coerência e fluidez)." />
    <meta name="author" content="Skip" />
    <meta name="theme-color" content="#0D0D14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F6FA" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/skip-copies-mark.svg" />
    <meta property="og:title" content="Skip Copies" />
    <meta property="og:description" content="Revisão de copies com três agentes." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('skip-copies-theme')
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          } else {
            document.documentElement.style.colorScheme = 'light'
          }
        } catch (e) {}
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
